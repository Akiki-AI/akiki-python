name: Build and publish

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current version after verification (requires an existing release tag)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  HF_HUB_OFFLINE: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  AKIKI_CACHE_DIR: ${{ github.workspace }}/.cache/models
  # Keep the native build tied to the tested engine source.
  AKIKI_INFERENCE_REV: f9411547bed3cd8159366c17458fdcc6427d4b15

jobs:
  build:
    name: Build and verify Linux x86_64 distributions
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out Python package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned Rust engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Akiki-AI/akiki-inference
          ref: ${{ env.AKIKI_INFERENCE_REV }}
          path: .cache/akiki-inference
          # Dedicated read-only deploy key for this private source repository.
          ssh-key: ${{ secrets.AKIKI_INFERENCE_SSH_KEY }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python verify_dist.py --version)"
          if [[ "$GITHUB_EVENT_NAME" == "release" && "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag must be v$version to match pyproject.toml." >&2
            exit 1
          fi

      - name: Install build and test tools
        run: |
          python -m pip install build "setuptools>=77.0.3" wheel auditwheel patchelf twine \
            pytest numpy soundfile onnxruntime
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Cache Rust dependencies locally
        run: cargo fetch --locked --manifest-path .cache/akiki-inference/Cargo.toml

      - name: Test native model loading
        run: |
          manifest=.cache/akiki-inference/Cargo.toml
          cargo test --offline --locked --manifest-path "$manifest" -p akiki-vad-engine --test safetensors
          cargo test --offline --locked --manifest-path "$manifest" -p akiki-vad-engine --lib config_tests
          cargo test --offline --locked --manifest-path "$manifest" -p akiki-minilm-engine

      - name: Build native engines offline
        run: python tools/build_native.py --inference-dir .cache/akiki-inference

      - name: Build portable wheel and source archive
        run: python -m build --no-isolation

      - name: Build and repair native wheel
        run: |
          native="$PWD/.cache/native-target/release"
          AKIKI_NATIVE_LIBRARY="$native/libakiki_vad_engine.so:$native/libakiki_minilm_engine.so" \
            python -m build --no-isolation --wheel --outdir .cache/raw-wheels
          auditwheel repair --plat manylinux_2_34_x86_64 --wheel-dir dist .cache/raw-wheels/*.whl

      - name: Verify release metadata and exact bundled model bytes
        run: |
          python verify_dist.py --all-wheels --require-native
          python -m twine check --strict dist/*

      # MiniLM weights are not bundled or downloaded: tiny generated models test the
      # MiniLM binding, and the real-model tests skip.
      - name: Run Python tests with the native engines required
        env:
          AKIKI_VAD_TEST_RUST: "1"
          AKIKI_MINILM_TEST_RUST: "1"
        run: python -m pytest -q

      - name: Test native wheel in a clean base installation
        run: |
          python -m venv "$RUNNER_TEMP/akiki-native"
          "$RUNNER_TEMP/akiki-native/bin/python" -m pip install dist/akiki-*-manylinux_2_34_x86_64.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/akiki-native/bin/python" -I - <<'PY'
          import importlib.util
          from pathlib import Path
          import akiki
          from akiki.minilm import _load_library
          import numpy as np

          assert importlib.util.find_spec("onnxruntime") is None
          assert importlib.util.find_spec("torch") is None
          with akiki.VAD() as vad:
              assert vad.engine is akiki.Engine.RUST
              assert vad.model_precision is akiki.ModelPrecision.INT8
              assert vad.fft_precision is akiki.FFTPrecision.FP32
              assert Path(vad._backend.lib._name).parent == Path(akiki.__file__).parent / "native"
              assert len(vad.push(np.zeros(256 * 3 + 17, np.float32))) == 3
          assert _load_library()[1].parent == Path(akiki.__file__).parent / "native"
          print("Native wheel: bundled Rust engines, INT8, base dependencies only")
          PY

      - name: Test portable wheel with the ONNX extra
        run: |
          version="$(python verify_dist.py --version)"
          python -m venv "$RUNNER_TEMP/akiki-onnx"
          "$RUNNER_TEMP/akiki-onnx/bin/python" -m pip install "dist/akiki-${version}-py3-none-any.whl[onnx]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/akiki-onnx/bin/python" -I - <<'PY'
          import importlib.util
          import numpy as np
          from akiki import Engine, ModelPrecision, VAD

          assert importlib.util.find_spec("torch") is None
          with VAD() as vad:
              assert vad.engine is Engine.ONNX and vad.model_precision is ModelPrecision.FP32
              assert len(vad.push(np.zeros(256 * 3 + 17, np.float32))) == 3
          print("Portable wheel: ONNX fallback, no PyTorch dependency")
          PY

      - name: Save verified distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions-x86_64
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-arm64:
    name: Build and verify Linux ARM64 VAD wheel
    runs-on: ubuntu-24.04-arm
    container:
      image: quay.io/pypa/manylinux_2_28_aarch64
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out Python package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install SSH checkout support
        run: dnf install -y openssh-clients

      - name: Check out pinned Rust engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Akiki-AI/akiki-inference
          ref: ${{ env.AKIKI_INFERENCE_REV }}
          path: .cache/akiki-inference
          ssh-key: ${{ secrets.AKIKI_INFERENCE_SSH_KEY }}
          persist-credentials: false

      - name: Select the manylinux Python interpreter
        run: echo /opt/python/cp312-cp312/bin >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.98.1"

      - name: Install build and test tools
        run: |
          test "$(uname -m)" = aarch64
          python -m pip install build "setuptools>=77.0.3" wheel auditwheel patchelf twine pytest numpy soundfile
          cargo fetch --locked --manifest-path .cache/akiki-inference/Cargo.toml

      - name: Build VAD only, offline
        run: python tools/build_native.py --inference-dir .cache/akiki-inference

      - name: Build and repair the ARM64 wheel
        run: |
          python -m build --no-isolation --sdist
          native="$PWD/.cache/native-target/release/libakiki_vad_engine.so"
          AKIKI_NATIVE_LIBRARY="$native" \
            python -m build --no-isolation --wheel --outdir .cache/raw-wheels
          auditwheel repair --plat manylinux_2_28_aarch64 --wheel-dir dist .cache/raw-wheels/*.whl
          python verify_dist.py --all-wheels --require-native --require-arm64
          python -m twine check --strict dist/*

      - name: Test Rust VAD and Python precision/streaming APIs
        env:
          AKIKI_VAD_TEST_RUST: "1"
          AKIKI_KERNELS_REQUIRE_SIMD: "1"
        run: |
          manifest=.cache/akiki-inference/Cargo.toml
          cargo test --offline --locked --release --manifest-path "$manifest" \
            -p akiki-inference-kernels -p akiki-inference-layers -p akiki-dsp -- --test-threads=1
          cargo test --offline --locked --manifest-path "$manifest" -p akiki-vad-engine --lib config_tests
          cargo test --offline --locked --manifest-path "$manifest" -p akiki-vad-engine --lib matrix_tests
          cargo test --offline --locked --manifest-path "$manifest" -p akiki-vad-engine --test safetensors
          python -m pytest -q

      - name: Test the installed ARM64 wheel with base dependencies only
        run: |
          version="$(python verify_dist.py --version)"
          python -m venv "$RUNNER_TEMP/akiki-arm64"
          "$RUNNER_TEMP/akiki-arm64/bin/python" -m pip install dist/akiki-*-manylinux_2_28_aarch64.whl
          cd "$RUNNER_TEMP"
          AKIKI_EXPECTED_VERSION="$version" "$RUNNER_TEMP/akiki-arm64/bin/python" -I - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          import akiki
          import numpy as np
          from akiki.minilm import _load_library

          assert akiki.__version__ == os.environ["AKIKI_EXPECTED_VERSION"]
          assert importlib.util.find_spec("onnxruntime") is None
          assert importlib.util.find_spec("torch") is None
          native = Path(akiki.__file__).parent / "native"
          assert {p.name for p in native.iterdir()} == {"libakiki_vad_engine.so"}
          with akiki.VAD() as vad:
              assert vad.engine is akiki.Engine.RUST and vad.model_precision is akiki.ModelPrecision.INT8
              assert Path(vad._backend.lib._name).parent == native
              assert len(vad.push(np.zeros(256 * 3 + 17, np.float32))) == 3
          try:
              _load_library()
          except RuntimeError as error:
              assert "VAD only" in str(error)
          else:
              raise AssertionError("MiniLM must not be bundled in the ARM64 wheel")
          print("ARM64 wheel: bundled Rust VAD, INT8 default, base dependencies only")
          PY

      - name: Save verified ARM64 wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions-arm64
          path: dist/*aarch64.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [build, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Retrieve verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-distributions-*
          merge-multiple: true
          path: dist/

      - name: Verify tagged source for a manual publication retry
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 verify_dist.py --version)"
          gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName
          gh api "repos/$GITHUB_REPOSITORY/compare/v$version...$GITHUB_SHA" \
            --jq '.files[].filename' > "$RUNNER_TEMP/release-changes.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          changed = set((Path(os.environ["RUNNER_TEMP"]) / "release-changes.txt").read_text().splitlines())
          allowed = {".github/workflows/publish.yml", "docs/releasing.md"}
          if changed - allowed:
              raise SystemExit("Manual publication must use tagged package source; only CI/release docs may differ")
          PY

      - name: Verify both native architectures before publishing
        run: python3 verify_dist.py --all-wheels --require-native --require-arm64

      # No environment is set: the PyPI publisher was registered without one.
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
