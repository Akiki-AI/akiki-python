name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev

      - name: Lint Python and sort imports
        run: ruff check --output-format=github .

      - name: Check Python formatting
        run: ruff format --check .

      - name: Lint YAML
        run: yamllint --strict .github .pre-commit-config.yaml .yamllint.yaml

  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install public test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=77.0.3" wheel
          python -m pip install -e '.[onnx]' --group dev

      # Fork PRs use public source and synthetic checkpoints only. Private engine
      # and training checks run in publish.yml after a trusted merge or dispatch.
      - name: Test the public package offline
        run: python -m pytest -q -rs
