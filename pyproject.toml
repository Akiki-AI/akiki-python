[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "akiki"
version = "0.2.2"
description = "Local voice activity detection, object detection, and decision models"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
authors = [{name = "Akiki AI"}]
keywords = ["vad", "audio", "speech", "voice-activity-detection", "decision-models", "intent-classification", "minilm", "sentence-embeddings", "text-classification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "soundfile>=0.12"]

[project.optional-dependencies]
huggingface = ["huggingface-hub>=0.24"]
onnx = ["onnxruntime>=1.17"]
pytorch = ["torch>=2.1"]
training = ["torch>=2.1", "transformers>=4.40,<6", "safetensors>=0.4"]

[project.urls]
Homepage = "https://huggingface.co/Akiki-AI"

[project.scripts]
akiki = "akiki.__main__:main"

[dependency-groups]
dev = [
  "pre-commit>=4.0",
  "pytest>=8.0",
  "ruff==0.17.3",
  "yamllint==1.38.0",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["akiki", "akiki.vision"]
namespaces = false

[tool.setuptools.package-data]
akiki = ["models/*.onnx", "models/*.pt", "models/*.json", "models/*.md", "models/*.txt", "models/akiki-vad-native/*.json", "models/akiki-vad-native/*.safetensors"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
required-version = "==0.17.3"
extend-exclude = [".cache", "verification"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["akiki"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
